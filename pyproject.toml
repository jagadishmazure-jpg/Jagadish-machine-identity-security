[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "machine-identity-security"
version = "0.1.0"
description = "Non-human identity security: lifecycle scoring, PAM, ITDR"
requires-python = ">=3.10"

[tool.hatch.build.targets.wheel]
packages = ["midsec"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B"]
ignore = ["E741", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
